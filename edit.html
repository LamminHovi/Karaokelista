<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>CSV Editor – Karaokelista</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border: 1px solid #ccc; padding: 6px; }
        td[contenteditable="true"] { background: #f9f9f9; }
        #searchBox { width: 300px; padding: 6px; margin-bottom: 10px; }
        .invalid { background: #ffcccc !important; }

        #counter {
            font-weight: bold;
            margin-left: 10px;
            font-size: 1.1em;
            color: #333;
        }

        th {
            cursor: pointer;
            user-select: none;
            background: #f0f0f0;
        }
        th:hover { background: #e0e0e0; }
        th.no-sort { cursor: default; }
        th.no-sort:hover { background: #f0f0f0; }

        .sort-icon {
            margin-left: 6px;
            font-size: 0.8em;
            color: #ccc;
        }
        th.sorted-asc .sort-icon,
        th.sorted-desc .sort-icon {
            color: #333;
        }

        /* Poista-nappi */
        .deleteBtn {
            color: #dc3545;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
            border: none;
            background: none;
            padding: 2px 8px;
        }
        .deleteBtn:hover {
            color: #a71d2a;
        }

        /* Lisää-nappi */
        #addBtn {
            background-color: #007bff;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
        }
        #addBtn:hover {
            background-color: #0056b3;
        }

        #unsavedBanner {
            display: none;
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        #unsavedBanner button {
            margin: 0 5px;
            padding: 4px 10px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
            color: white;
        }
        #unsavedBanner .restore { background: #28a745; }
        #unsavedBanner .discard { background: #dc3545; }

        #autoSaveStatus {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #4CAF50;
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.9em;
        }
    </style>

    <script>
    function laiteVari(laite) {
        if (laite === "C") return "#40E0D0";
        if (laite === "C_U") return "#6495ED";
        if (laite === "C_O") return "#FFFF99";
        if (laite === "C_O_U") return "#FFD700";
        if (laite === "C_O_UK") return "#FFA500";
        if (laite === "C_O_UU") return "#b37400";
        if (laite === "K") return "#FFFFFF";
        if (laite === "M") return "#90EE90";
        if (laite === "MF") return "#8FBC8F";
        if (laite === "M_U") return "#0c4c0c";
        return "";
    }
    window.laiteVari = laiteVari;
    </script>
</head>
<body>

<h2>CSV Editor – Karaokelista</h2>

<div id="unsavedBanner">
    &#9888;&#65039; Sinulla on tallentamattomia muutoksia edellisest&#228; istunnosta.
    <button class="restore" onclick="restoreUnsaved()">Palauta</button>
    <button class="discard" onclick="discardUnsaved()">Hylk&#228;&#228;</button>
</div>

<input type="text" id="searchBox" placeholder="Hae kappaletta..." onkeyup="searchCSV()">
<button onclick="clearSearch()">Tyhjenn&#228;</button>
<span id="counter"></span>

<br><br>

<button onclick="downloadCSV()">Lataa uusi CSV</button>
<button id="addBtn" onclick="addNewSong()">Lis&#228;&#228; uusi kappale</button>

<table id="csvTable">
    <thead>
        <tr>
            <th onclick="sortColumn(0)">ARTISTI <span class="sort-icon"></span></th>
            <th onclick="sortColumn(1)">KAPPALE <span class="sort-icon"></span></th>
            <th onclick="sortColumn(2)">KONE <span class="sort-icon"></span></th>
            <th onclick="sortColumn(3)">KOODI <span class="sort-icon"></span></th>
            <th onclick="sortColumn(4)">LIS&#228;TTY PVM <span class="sort-icon"></span></th>
            <th class="no-sort" style="width:50px; text-align:center;">POISTA</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="autoSaveStatus">Tallennettu &#10003;</div>

<script src="edit.js"></script>

</body>
</html>
