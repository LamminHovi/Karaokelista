<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>CSV Editor – Karaokelista</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border: 1px solid #ccc; padding: 6px; }
        td[contenteditable="true"] { background: #f9f9f9; }
        button { margin: 5px 5px 10px 0; padding: 6px 12px; }
        #searchBox { width: 300px; padding: 6px; margin-bottom: 10px; }
        .invalid { background: #ffcccc !important; }
    </style>
</head>
<body>

<h2>CSV Editor – Karaokelista</h2>

<input type="text" id="searchBox" placeholder="Hae kappaletta..." onkeyup="searchCSV()">
<button onclick="clearSearch()">Tyhjennä</button>

<br>

<button onclick="addRow()">Lisää rivi</button>
<button onclick="downloadCSV()">Lataa uusi CSV</button>
<button id="updateBtn" onclick="runBat()">Päivitä GitHubi</button>

<script>
function runBat() {
    if (confirm("Haluatko varmasti päivittää?")) {
        window.location.href = "file:///C:/KappAppNet/RunBat.vbs";
        alert("GitHub päivitetty onnistuneesti!");
    }
}
</script>

<style>
#updateBtn {
    background-color: #4CAF50; /* vihreä */
    color: white;
    padding: 8px 14px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 10px;
}
#updateBtn:hover {
    background-color: #45a049;
}
</script>
    function koneVari(kone) {
    if (kone === "C") return "#40E0D0";
    if (kone === "C_U") return "#FF0000";
    if (kone === "C_O") return "#FFFF00";
    if (kone === "C_O_U") return "#FFD700";
    if (kone === "C_O_UK") return "#FF8C00";
    if (kone === "K") return "#FF6347";
    if (kone === "M") return "#00FF7F";
    if (kone === "MU") return "#6B8E23";
    return "";
}

</style>


<table id="csvTable">
    <thead>
        <tr>
            <th>Artisti</th>
            <th>Kappale</th>
            <th>Laite</th>
            <th>Koodi</th>
            <th>Lisätty PVM</th>
            <th>Muuta</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="edit.js"></script>
</body>
</html>
