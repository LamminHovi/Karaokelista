<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>CSV Editor - Karaokelista</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border: 1px solid #ccc; padding: 6px; }
        td[contenteditable="true"] { background: #f9f9f9; }
        #searchBox { width: 300px; padding: 6px; margin-bottom: 10px; }
        .invalid { background: #ffcccc !important; }

        #counter {
            font-weight: bold;
            margin-left: 10px;
            font-size: 1.1em;
            color: #333;
        }

        th {
            cursor: pointer;
            user-select: none;
            background: #f0f0f0;
        }
        th:hover { background: #e0e0e0; }

        .sort-icon {
            margin-left: 6px;
            font-size: 0.8em;
            color: #ccc;
        }
        th.sorted-asc .sort-icon,
        th.sorted-desc .sort-icon {
            color: #333;
        }

        #unsavedBanner {
            display: none;
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        #unsavedBanner button {
            margin: 0 5px;
            padding: 4px 10px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
            color: white;
        }
        #unsavedBanner .restore { background: #28a745; }
        #unsavedBanner .discard { background: #dc3545; }

        #autoSaveStatus {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: #4CAF50;
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.9em;
        }
    </style>

    <script>
    function laiteVari(laite) {
        if (laite === "C") return "#40E0D0";
        if (laite === "C_U") return "#FF0000";
        if (laite === "C_O") return "#FFFF00";
        if (laite === "C_O_U") return "#FFD700";
        if (laite === "C_O_UK") return "#FF8C00";
        if (laite === "K") return "#FF6347";
        if (laite === "M") return "#00FF7F";
        if (laite === "M_U") return "#6B8E23";
        return "";
    }
    window.laiteVari = laiteVari;
    </script>
</head>
<body>

<h2>CSV Editor - Karaokelista</h2>

<div id="unsavedBanner">
    ⚠️ Sinulla on tallentamattomia muutoksia edellisestä istunnosta.
    <button class="restore" onclick="restoreUnsaved()">Palauta</button>
    <button class="discard" onclick="discardUnsaved()">Hylkää</button>
</div>

<input type="text" id="searchBox" placeholder="Hae kappaletta..." onkeyup="searchCSV()">
<button onclick="clearSearch()">Tyhjennä</button>
<span id="counter"></span>

<br><br>

<button onclick="downloadCSV()">Lataa uusi CSV</button>

<table id="csvTable">
    <thead>
        <tr>
            <th onclick="sortColumn(0)">ARTISTI <span class="sort-icon"></span></th>
            <th onclick="sortColumn(1)">KAPPALE <span class="sort-icon"></span></th>
            <th onclick="sortColumn(2)">KONE <span class="sort-icon"></span></th>
            <th onclick="sortColumn(3)">KOODI <span class="sort-icon"></span></th>
            <th onclick="sortColumn(4)">LISÄTTY PVM <span class="sort-icon"></span></th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="autoSaveStatus">Tallennettu ✓</div>

<script src="edit.js"></script>

</body>
</html>
